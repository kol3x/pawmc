<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Assistant</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { --bg: #fff; --text: #333; --border: #ccc; --input-bg: #fff; --user: #4da3ff; --code-bg: #f4f4f4; --code-text: #333; --blockquote: #666; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1a1a1a; --text: #e0e0e0; --border: #444; --input-bg: #2a2a2a; --user: #4da3ff; --code-bg: #2a2a2a; --code-text: #e0e0e0; --blockquote: #999; }
      }
      body { font-family: system-ui; background: var(--bg); color: var(--text); }
      input, select, button, textarea { width: 100%; padding: 8px; margin: 4px 0; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }
      textarea { height: 80px; resize: none; }
      #messages { height: 500px; overflow-y: auto; border: 1px solid var(--border); padding: 10px; margin: 10px 0; background: var(--bg); }
      .msg { margin: 8px 0; line-height: 1.5; }
      .msg.user { color: var(--user); }
      .msg.assistant { color: var(--text); }
      .msg.assistant p { margin: 0.5em 0; }
      .msg.assistant code { background: var(--code-bg); color: var(--code-text); padding: 2px 4px; border-radius: 3px; }
      .msg.assistant pre { background: var(--code-bg); padding: 10px; border-radius: 5px; overflow-x: auto; }
      .msg.assistant pre code { background: none; padding: 0; }
      .msg.assistant ul, .msg.assistant ol { padding-left: 20px; }
      .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { margin-top: 0.5em; }
      .msg.assistant blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--blockquote); }
      #sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100%; background: var(--input-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
      #main { margin-left: 290px; max-width: 900px; padding: 20px; }
      .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
      .sidebar-header h3 { font-size: 16px; font-weight: 600; margin: 0; }
      .sidebar-actions { display: flex; gap: 6px; }
      .sidebar-actions button { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); cursor: pointer; font-size: 18px; line-height: 1; }
      .sidebar-actions button:hover { background: var(--code-bg); }
      #sidebarSearch { margin: 8px 12px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; width: auto; }
      #sidebarSearch::placeholder { color: var(--blockquote); }
      #conversations { flex: 1; overflow-y: auto; padding: 4px 8px; }
      .conv-item { display: block; width: 100%; padding: 10px 12px; cursor: pointer; border-radius: 8px; margin: 2px 0; text-align: left; border: none; background: transparent; color: var(--text); transition: background 0.15s; }
      .conv-item:hover { background: var(--code-bg); }
      .conv-item.active { background: var(--user); color: #fff; }
      .conv-item.active .conv-delete:hover { background: rgba(255,255,255,0.2); }
      .conv-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conv-preview { font-size: 12px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conv-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
      .conv-time { font-size: 11px; opacity: 0.5; }
      .conv-delete { opacity: 0; background: none; border: none; color: inherit; cursor: pointer; padding: 2px 4px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
      .conv-item:hover .conv-delete { opacity: 0.5; }
      .conv-delete:hover { opacity: 1 !important; background: rgba(255,0,0,0.15); }
      .conv-item.active .conv-delete:hover { background: rgba(255,255,255,0.2); }
      #explorePanel { border-top: 1px solid var(--border); }
      #exploreToggle { display: flex; align-items: center; gap: 6px; padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); background: none; border: none; width: 100%; text-align: left; }
      #exploreToggle:hover { background: var(--code-bg); }
      #exploreToggle .chevron { font-size: 0.8em; transition: transform 0.2s; color: var(--blockquote); }
      #exploreToggle.collapsed .chevron { transform: rotate(-90deg); }
      #exploreBody { max-height: 300px; overflow-y: auto; padding: 8px 12px; }
      #exploreBody.collapsed { display: none; }
      .update-btn { margin: 8px 12px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); cursor: pointer; font-size: 12px; flex-shrink: 0; width: calc(100% - 24px); white-space: nowrap; }
      .update-btn:hover { background: var(--code-bg); }
      #contextSources { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0; }
      #contextSources label { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; user-select: none; }
      #contextSources input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; }
      .chip-input { border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; margin: 4px 0; background: var(--input-bg); cursor: text; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 36px; position: relative; }
      .chip-input:focus-within { border-color: var(--user); }
      .chip-list { display: contents; }
      .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; font-size: 12px; line-height: 1.4; white-space: nowrap; cursor: default; }
      .chip.primary { background: var(--user); color: #fff; }
      .chip.context { background: var(--code-bg); color: var(--text); border: 1px solid var(--border); }
      .chip-remove { cursor: pointer; opacity: 0.6; font-size: 14px; line-height: 1; margin-left: 2px; }
      .chip-remove:hover { opacity: 1; }
      .chip-input input { border: none; outline: none; flex: 1; min-width: 120px; padding: 4px; margin: 0; background: transparent; color: var(--text); font-size: 13px; }
      .chat-section { margin-bottom: 8px; }
      .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; margin-bottom: 2px; }
      .about-box { border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; background: var(--input-bg); display: flex; align-items: center; gap: 4px; min-height: 36px; position: relative; }
      .about-box:focus-within { border-color: var(--user); }
      .about-chip { display: none; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; font-size: 12px; line-height: 1.4; background: var(--user); color: #fff; white-space: nowrap; }
      .about-box.has-chip .about-chip { display: inline-flex; }
      .about-box.has-chip .about-input { display: none; }
      .about-input { border: none; outline: none; flex: 1; min-width: 120px; padding: 4px; margin: 0; background: transparent; color: var(--text); font-size: 13px; }
      .suggestions-below { position: relative; }
      .suggestions-below .chip-suggestions { position: absolute; top: 100%; left: 0; right: 0; z-index: 100; }
      .chip-suggestions { position: absolute; top: 100%; left: 0; right: 0; background: var(--input-bg); border: 1px solid var(--border); border-top: none; border-radius: 0 0 4px 4px; max-height: 200px; overflow-y: auto; z-index: 100; display: none; }
      .chip-suggestions.visible { display: block; }
      .chip-suggestion { padding: 6px 10px; cursor: pointer; font-size: 13px; }
      .chip-suggestion:hover, .chip-suggestion.highlighted { background: var(--code-bg); }
      .chip-suggestion .sug-label { font-weight: 500; }
      .chip-suggestion .sug-type { font-size: 11px; opacity: 0.6; margin-left: 6px; }

      .cat-item { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden; }
      .cat-header, .topic-header { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 10px; background: var(--input-bg); border-radius: 6px; user-select: none; margin-bottom: 4px; }
      .cat-header:hover, .topic-header:hover { background: var(--code-bg); }
      .cat-header .icon, .topic-header .icon { font-weight: bold; font-family: monospace; }
      .cat-header .cat-title, .topic-header .topic-title { flex: 1; font-weight: bold; }
      .cat-header .chevron, .topic-header .chevron { font-size: 0.8em; transition: transform 0.2s; color: var(--blockquote); }
      .cat-header.collapsed .chevron, .topic-header.collapsed .chevron { transform: rotate(-90deg); }
      .cat-body, .topic-body { padding: 10px 10px 10px 20px; border-left: 2px solid var(--border); margin-left: 12px; }
      .cat-body.collapsed, .topic-body.collapsed { display: none; }
      .topic-header { font-size: 0.9em; padding: 8px; background: transparent; }
      .topic-header:hover { background: var(--code-bg); }
      .cat-summary { margin: 5px 0; color: var(--blockquote); }
      .cat-summary p { margin: 0.5em 0; }
      .cat-summary code { background: var(--code-bg); color: var(--code-text); padding: 2px 4px; border-radius: 3px; }
      .cat-summary pre { background: var(--code-bg); padding: 10px; border-radius: 5px; overflow-x: auto; }
      .cat-summary pre code { background: none; padding: 0; }
      .cat-summary ul, .cat-summary ol { padding-left: 20px; }
      .cat-summary h1, .cat-summary h2, .cat-summary h3 { margin-top: 0.5em; }
      .cat-summary blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--blockquote); }
      .topic-item { margin: 5px 0 5px 15px; }
      .topic-name { font-weight: bold; }
      .topic-summary { color: var(--blockquote); font-size: 0.9em; }
      .topic-summary p { margin: 0.5em 0; }
      .topic-summary code { background: var(--code-bg); color: var(--code-text); padding: 2px 4px; border-radius: 3px; }
      .topic-summary pre { background: var(--code-bg); padding: 10px; border-radius: 5px; overflow-x: auto; }
      .topic-summary pre code { background: none; padding: 0; }
      .topic-summary ul, .topic-summary ol { padding-left: 20px; }
      .topic-summary h1, .topic-summary h2, .topic-summary h3 { margin-top: 0.5em; }
      .topic-summary blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--blockquote); }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="sidebar-header">
        <h3>Conversations</h3>
        <div class="sidebar-actions">
          <button onclick="newConversation()" title="New conversation">+</button>
          <button onclick="toggleExplore()" id="exploreBtn" title="Explore memory tree">&#x1F332;</button>
        </div>
      </div>
      <input id="sidebarSearch" type="text" placeholder="Search conversations..." oninput="renderConversations()" />
      <div id="conversations"></div>
      <div id="explorePanel">
        <button id="exploreToggle" class="collapsed" onclick="toggleExplorePanel()">
          <span class="chevron">&#x25BC;</span>
          Memory Tree
        </button>
        <div id="exploreBody" class="collapsed"></div>
      </div>
      <button class="update-btn" onclick="updateSummaries()">Update Summaries</button>
    </div>
    <div id="main">
      <details style="margin-bottom:10px">
        <summary style="cursor:pointer;user-select:none;font-size:14px;color:var(--blockquote)">API Key</summary>
        <input id="apiKey" type="password" placeholder="API Key" />
      </details>
      <div class="chat-section">
        <div class="section-label">Conversation About</div>
        <div class="about-box" id="aboutBox">
          <span class="about-chip" id="aboutChip">
            <span id="aboutChipLabel"></span>
            <span class="chip-remove" id="aboutChipRemove" onclick="clearAboutChip()">x</span>
          </span>
          <input id="aboutInput" class="about-input" type="text" placeholder="Enter topic... (e.g. Work > ProjectX)" autocomplete="off" />
          <div id="aboutSuggestions" class="chip-suggestions"></div>
        </div>
      </div>
      <div class="chat-section">
        <div class="section-label">Additional Context (optional)</div>
        <div id="contextChips" class="chip-input">
          <div class="chip-list" id="contextList"></div>
          <input id="contextInput" type="text" placeholder="Add category or topic..." autocomplete="off" />
          <div id="contextSuggestions" class="chip-suggestions"></div>
        </div>
      </div>
      <textarea id="message" placeholder="Continue a topic, log a decision..."></textarea>
      <div id="contextSources"></div>
      <div style="display:flex;gap:6px;align-items:center">
        <button id="sendBtn" onclick="send()" style="flex:1">Send</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none">
          <input type="checkbox" id="noteMode" onchange="toggleNoteMode()" style="width:auto;margin:0" />
          Save as note
        </label>
      </div>
      <div id="messages"></div>
    </div>
    <script>
      const base = location.origin
      const msgs = document.getElementById("messages")
      const apiKey = document.getElementById("apiKey")
      const message = document.getElementById("message")

      const aboutInput = document.getElementById("aboutInput")
      const aboutBox = document.getElementById("aboutBox")
      const aboutChip = document.getElementById("aboutChip")
      const aboutChipLabel = document.getElementById("aboutChipLabel")
      const aboutSuggestions = document.getElementById("aboutSuggestions")
      const contextInput = document.getElementById("contextInput")
      const contextList = document.getElementById("contextList")
      const contextSuggestions = document.getElementById("contextSuggestions")

      let aboutChipValue = null
      let contextChips = []
      let autocompleteOptions = []
      let highlightedIndex = -1
      let activeSuggestions = null

      function buildAutocompleteOptions() {
        const options = []
        for (const cat of categoriesData) {
          options.push({ label: cat.name, category: cat.name, topic: null, type: "category" })
          for (const topic of cat.topics) {
            options.push({ label: `${cat.name} > ${topic.name}`, category: cat.name, topic: topic.name, type: "topic" })
          }
        }
        return options
      }

      function renderAboutChip() {
        if (aboutChipValue) {
          aboutBox.classList.add("has-chip")
          aboutChipLabel.textContent = `${aboutChipValue.category} > ${aboutChipValue.topic}`
        } else {
          aboutBox.classList.remove("has-chip")
        }
        updateSendButton()
      }

      function renderContextChips() {
        contextList.innerHTML = contextChips.map((chip, i) => {
          const label = chip.topic ? `${chip.category} > ${chip.topic}` : chip.category
          return `<span class="chip context">${escapeHtml(label)}<span class="chip-remove" data-index="${i}">x</span></span>`
        }).join("")
      }

      function setAboutChip(category, topic) {
        aboutChipValue = category && topic ? { category, topic } : null
        renderAboutChip()
        aboutInput.value = ""
        hideSuggestions(aboutSuggestions)
        aboutInput.blur()
      }

      function commitAboutInput(text) {
        const trimmed = text.trim()
        if (!trimmed) return
        const sepIndex = trimmed.indexOf(" > ")
        if (sepIndex !== -1) {
          setAboutChip(trimmed.slice(0, sepIndex).trim(), trimmed.slice(sepIndex + 3).trim())
        } else {
          setAboutChip(trimmed, trimmed)
        }
      }

      function clearAboutChip() {
        setAboutChip(null, null)
        aboutInput.focus()
      }

      function addContextChip(category, topic) {
        if (!category) return
        const exists = contextChips.some(c => c.category.toLowerCase() === category.toLowerCase() && (c.topic || "").toLowerCase() === (topic || "").toLowerCase())
        if (exists) return
        contextChips.push({ category, topic: topic || null })
        renderContextChips()
        contextInput.value = ""
        hideSuggestions(contextSuggestions)
        contextInput.focus()
      }

      function removeContextChip(index) {
        contextChips.splice(index, 1)
        renderContextChips()
      }

      function clearAllChips() {
        aboutChipValue = null
        contextChips = []
        renderAboutChip()
        renderContextChips()
      }

      function setChipsFromData(primaryCategory, primaryTopic, contextCategories) {
        aboutChipValue = primaryCategory && primaryTopic ? { category: primaryCategory, topic: primaryTopic } : null
        contextChips = []
        if (Array.isArray(contextCategories)) {
          for (const ctx of contextCategories) {
            if (ctx.category && !contextChips.some(c => c.category === ctx.category && c.topic === (ctx.topic || null))) {
              contextChips.push({ category: ctx.category, topic: ctx.topic || null })
            }
          }
        }
        renderAboutChip()
        renderContextChips()
      }

      function filterSuggestions(query) {
        if (!query.trim()) return autocompleteOptions
        const q = query.toLowerCase()
        return autocompleteOptions.filter(o =>
          o.label.toLowerCase().includes(q) ||
          o.category.toLowerCase().includes(q) ||
          (o.topic && o.topic.toLowerCase().includes(q))
        )
      }

      function showSuggestions(suggestionsEl, results) {
        if (!results.length) { hideSuggestions(suggestionsEl); return }
        highlightedIndex = -1
        activeSuggestions = suggestionsEl
        suggestionsEl.innerHTML = results.map((r, i) =>
          `<div class="chip-suggestion" data-index="${i}"><span class="sug-label">${escapeHtml(r.label)}</span><span class="sug-type">${r.type === "category" ? "category" : "topic"}</span></div>`
        ).join("")
        suggestionsEl.classList.add("visible")
      }

      function hideSuggestions(suggestionsEl) {
        if (suggestionsEl) suggestionsEl.classList.remove("visible")
        highlightedIndex = -1
        activeSuggestions = null
      }

      function getHighlightedSuggestion(suggestionsEl) {
        const items = suggestionsEl.querySelectorAll(".chip-suggestion")
        if (highlightedIndex >= 0 && highlightedIndex < items.length) {
          return { el: items[highlightedIndex], index: highlightedIndex }
        }
        return null
      }

      function selectSuggestion(suggestionsEl, index) {
        const items = suggestionsEl.querySelectorAll(".chip-suggestion")
        if (index < 0 || index >= items.length) return
        const dataIndex = parseInt(items[index].dataset.index)
        const inputValue = suggestionsEl === aboutSuggestions ? aboutInput.value : contextInput.value
        let results = filterSuggestions(inputValue)
        if (suggestionsEl === aboutSuggestions) {
          results = results.filter(r => r.type === "topic")
        }
        const option = results[dataIndex]
        if (!option) return
        if (suggestionsEl === aboutSuggestions) {
          setAboutChip(option.category, option.topic)
        } else {
          addContextChip(option.category, option.topic)
        }
      }

      function updateSendButton() {
        const btn = document.getElementById("sendBtn")
        if (aboutChipValue) {
          btn.textContent = document.getElementById("noteMode").checked ? "Save Note" : "Send"
        }
      }

      function setupInput(inputEl, suggestionsEl, opts) {
        inputEl.addEventListener("input", function() {
          document.getElementById("sendBtn").textContent = "Send"
          let results = filterSuggestions(this.value)
          if (opts.onlyTopics) results = results.filter(r => r.type === "topic")
          showSuggestions(suggestionsEl, results)
        })

        inputEl.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault()
            const highlighted = getHighlightedSuggestion(suggestionsEl)
            if (highlighted) {
              selectSuggestion(suggestionsEl, highlighted.index)
            } else if (this.value.trim()) {
              const query = this.value
              let results = filterSuggestions(query)
              if (opts.onlyTopics) results = results.filter(r => r.type === "topic")
              const first = results[0]
              if (first) {
                if (suggestionsEl === aboutSuggestions) {
                  setAboutChip(first.category, first.topic)
                } else {
                  addContextChip(first.category, first.topic)
                }
              } else if (suggestionsEl === aboutSuggestions) {
                commitAboutInput(query)
              } else {
                addContextChip(query, null)
              }
            }
          } else if (e.key === "Backspace" && !this.value && suggestionsEl === contextSuggestions && contextChips.length) {
            removeContextChip(contextChips.length - 1)
          } else if (e.key === "ArrowDown") {
            e.preventDefault()
            const items = suggestionsEl.querySelectorAll(".chip-suggestion")
            items.forEach(el => el.classList.remove("highlighted"))
            highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1)
            if (highlightedIndex >= 0) items[highlightedIndex]?.classList.add("highlighted")
          } else if (e.key === "ArrowUp") {
            e.preventDefault()
            const items = suggestionsEl.querySelectorAll(".chip-suggestion")
            items.forEach(el => el.classList.remove("highlighted"))
            highlightedIndex = Math.max(highlightedIndex - 1, -1)
            if (highlightedIndex >= 0) items[highlightedIndex]?.classList.add("highlighted")
          } else if (e.key === "Escape") {
            hideSuggestions(suggestionsEl)
          }
        })

        inputEl.addEventListener("blur", function() {
          setTimeout(() => hideSuggestions(suggestionsEl), 150)
        })

        inputEl.addEventListener("focus", function() {
          if (this.value.trim()) {
            let results = filterSuggestions(this.value)
            if (opts.onlyTopics) results = results.filter(r => r.type === "topic")
            showSuggestions(suggestionsEl, results)
          }
        })

        suggestionsEl.addEventListener("mousedown", function(e) {
          const item = e.target.closest(".chip-suggestion")
          if (item) {
            e.preventDefault()
            selectSuggestion(suggestionsEl, parseInt(item.dataset.index))
          }
        })

        inputEl.addEventListener("click", function() {
          if (this.value.trim()) {
            let results = filterSuggestions(this.value)
            if (opts.onlyTopics) results = results.filter(r => r.type === "topic")
            showSuggestions(suggestionsEl, results)
          }
        })
      }

      setupInput(aboutInput, aboutSuggestions, { onlyTopics: true })
      setupInput(contextInput, contextSuggestions, { onlyTopics: false })

      contextList.addEventListener("click", function(e) {
        const remove = e.target.closest(".chip-remove")
        if (remove) {
          const index = parseInt(remove.dataset.index)
          removeContextChip(index)
        }
      })

      aboutBox.addEventListener("click", function(e) {
        if (e.target.closest(".chip-remove")) return
        if (aboutChipValue) {
          aboutInput.focus()
        }
      })

      const savedKey = localStorage.getItem("apiKey")
      if (savedKey) apiKey.value = savedKey

      apiKey.addEventListener("change", () => {
        localStorage.setItem("apiKey", apiKey.value)
        loadCategories()
      })

      let conversations = []
      let currentConvId = null
      let currentMessages = []

      function renderConversations() {
        const container = document.getElementById("conversations")
        const search = (document.getElementById("sidebarSearch")?.value || "").toLowerCase()
        const filtered = conversations.filter(c => {
          if (!search) return true
          return (c.category + " " + c.topic + " " + (c.last_message || "")).toLowerCase().includes(search)
        })
        container.innerHTML = filtered
          .map(c => {
            const label = [c.category, c.topic].filter(Boolean).join(" / ")
            const preview = c.last_message || ""
            const time = c.created_at ? relativeTime(c.created_at) : ""
            const isActive = c.id === currentConvId
            const hasContext = c.contextCategories?.length > 0
            return `<div class="conv-item ${isActive ? "active" : ""}" onclick="loadConversation(${c.id})">
              <div class="conv-title">${escapeHtml(label) || "New conversation"}${hasContext ? '<span style="margin-left:4px;font-size:11px;opacity:0.7">+</span>' : ""}</div>
              ${preview ? `<div class="conv-preview">${escapeHtml(preview)}${preview.length >= 80 ? "..." : ""}</div>` : ""}
              <div class="conv-meta">
                <span class="conv-time">${time}</span>
                <button class="conv-delete" aria-label="Delete conversation" title="Delete conversation" onclick="event.stopPropagation();deleteConversation(${c.id})"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
              </div>
            </div>`
          })
          .join("")
        if (!filtered.length) {
          container.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.5;font-size:13px">No conversations</div>'
        }
      }

      function relativeTime(timestamp) {
        const now = Math.floor(Date.now() / 1000)
        const diff = now - timestamp
        if (diff < 60) return "just now"
        if (diff < 3600) return Math.floor(diff / 60) + "m ago"
        if (diff < 86400) return Math.floor(diff / 3600) + "h ago"
        if (diff < 172800) return "yesterday"
        if (diff < 604800) return Math.floor(diff / 86400) + "d ago"
        return new Date(timestamp * 1000).toLocaleDateString()
      }

      function newConversation() {
        currentConvId = null
        currentMessages = []
        clearAllChips()
        msgs.innerHTML = ""
        document.getElementById("sidebarSearch").value = ""
        renderConversations()
      }

      async function loadConversation(id) {
        const conv = conversations.find((c) => c.id === id)
        if (!conv) return
        currentConvId = id
        setChipsFromData(conv.category, conv.topic, conv.contextCategories)
        msgs.innerHTML = '<div class="msg">Loading...</div>'
        const res = await req("GET", `/conversation?id=${id}`)
        if (res.messages) {
          currentMessages = res.messages.map(m => ({ role: m.role, text: m.content }))
        } else {
          currentMessages = []
        }
        msgs.innerHTML = currentMessages
          .map((m) => `<div class="msg ${m.role}"><b>${m.role}:</b> ${m.role === "assistant" ? parseMarkdown(m.text) : m.text}</div>`)
          .join("")
        msgs.scrollTop = msgs.scrollHeight
        renderConversations()
      }

      function addMsg(role, text) {
        const content = role === 'assistant' ? parseMarkdown(text) : text
        msgs.innerHTML += `<div class="msg ${role}"><b>${role}:</b> ${content}</div>`
        msgs.scrollTop = msgs.scrollHeight
        currentMessages.push({ role, text })
      }

      async function refreshConversations() {
        const res = await req("GET", "/conversations")
        if (Array.isArray(res)) {
          conversations = res
          renderConversations()
        }
      }

      async function deleteConversation(id) {
        if (!confirm("Delete this conversation?")) return
        await req("DELETE", `/conversation?id=${id}`)
        if (currentConvId === id) newConversation()
        await refreshConversations()
      }

      async function loadContextSources() {
        const res = await req("GET", "/context-sources")
        if (Array.isArray(res)) {
          const container = document.getElementById("contextSources")
          container.innerHTML = res.map(s => `<label><input type="checkbox" value="${escapeHtml(s.name)}" /> ${escapeHtml(s.name)}</label>`).join("")
        }
      }

      newConversation()
      refreshConversations()
      loadCategories()
      loadContextSources()

      async function req(method, path, body) {
        const headers = { Authorization: `Bearer ${apiKey.value}` }
        if (body) headers["Content-Type"] = "application/json"
        const r = await fetch(base + path, { method, headers, body: body ? JSON.stringify(body) : undefined })
        return r.json()
      }

      function toggleExplore() {
        const toggle = document.getElementById("exploreToggle")
        if (toggle.classList.contains("collapsed")) {
          toggleExplorePanel()
        }
        document.getElementById("exploreBody").scrollIntoView({ behavior: "smooth" })
      }

      function toggleExplorePanel() {
        const toggle = document.getElementById("exploreToggle")
        const body = document.getElementById("exploreBody")
        toggle.classList.toggle("collapsed")
        body.classList.toggle("collapsed")
        if (!body.classList.contains("collapsed") && !body.children.length) {
          renderExplore()
        }
      }

      function toggleCategory(el) {
        el.classList.toggle('collapsed');
        el.nextElementSibling.classList.toggle('collapsed');
      }

      function toggleTopic(el) {
        el.classList.toggle('collapsed');
        el.nextElementSibling.classList.toggle('collapsed');
      }

      function getSelectedContextSources() {
        return [...document.querySelectorAll("#contextSources input:checked")].map(cb => cb.value)
      }

      function toggleNoteMode() {
        const btn = document.getElementById("sendBtn")
        btn.textContent = document.getElementById("noteMode").checked ? "Save Note" : "Send"
      }

      async function send() {
        const btn = document.getElementById("sendBtn")
        if (!apiKey.value || !message.value) return alert("Fill API key and message")
        if (!aboutChipValue) {
          if (aboutInput.value.trim()) {
            commitAboutInput(aboutInput.value)
          }
          if (!aboutChipValue) {
            btn.disabled = true
            btn.textContent = "Generating..."
            const suggest = await req("POST", "/suggest-category", { message: message.value })
            btn.disabled = false
            if (suggest.category && suggest.topic) {
              setAboutChip(suggest.category, suggest.topic)
            }
            btn.textContent = "Confirm Send"
            return
          }
        }
        btn.textContent = "Send"
        const noteMode = document.getElementById("noteMode").checked
        addMsg("user", message.value)
        const contextSources = getSelectedContextSources()
        const contextCategories = contextChips.length ? contextChips : undefined
        const res = await req("POST", "/chat", { category: aboutChipValue.category, topic: aboutChipValue.topic, message: message.value, contextSources: contextSources.length ? contextSources : undefined, noteMode, contextCategories })
        if (noteMode) {
          msgs.innerHTML += `<div class="msg" style="opacity:0.5;font-size:12px"><i>Note saved</i></div>`
          msgs.scrollTop = msgs.scrollHeight
        } else {
          addMsg("assistant", res.response || res.error)
        }
        message.value = ""
        if (res.conversationId) currentConvId = res.conversationId
        await refreshConversations()
      }

      let categoriesData = []

      function renderExplore() {
        const container = document.getElementById("exploreBody")
        container.innerHTML = categoriesData
          .map(c => `
            <div class="cat-item">
              <div class="cat-header collapsed" onclick="toggleCategory(this)">
                <span class="icon">+</span>
                <span class="cat-title">${escapeHtml(c.name)}</span>
                <span class="chevron">v</span>
              </div>
              <div class="cat-body collapsed">
                <div class="cat-summary">${c.summary ? parseMarkdown(c.summary) : '<em>no summary</em>'}</div>
                ${c.topics.map(t => `
                  <div class="topic-item">
                    <div class="topic-header collapsed" onclick="toggleTopic(this)">
                      <span class="icon">-</span>
                      <span class="topic-title">${escapeHtml(t.name)}</span>
                      <span class="chevron">v</span>
                    </div>
                    <div class="topic-body collapsed">
                      <div class="topic-summary">${t.summary ? parseMarkdown(t.summary) : '<em>no summary</em>'}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join("")
      }

      async function loadCategories() {
        const res = await req("GET", "/categories")
        categoriesData = res
        autocompleteOptions = buildAutocompleteOptions()
        renderExplore()
      }

      async function updateSummaries() {
        const body = document.getElementById("exploreBody")
        body.innerHTML = 'Updating summaries...'
        const toggle = document.getElementById("exploreToggle")
        toggle.classList.remove("collapsed")
        body.classList.remove("collapsed")
        const res = await req("POST", "/update-summaries")
        if (res.success) {
          loadCategories()
        } else {
          body.innerHTML = `Error: ${res.error}`
        }
      }

      function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      }

      function parseMarkdown(text) {
        text = escapeHtml(text)
        text = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>')
        text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>')
        text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>')
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        text = text.replace(/\*(.+?)\*/g, '<em>$1</em>')
        text = text.replace(/`(.+?)`/g, '<code>$1</code>')
        text = text.replace(/^\* (.+)$/gm, '<li>$1</li>')
        text = text.replace(/(<li>.*?<\/li>)/gs, '<ul>$1</ul>')
        text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        text = text.replace(/\n/g, '<br>')
        return text
      }
    </script>
  </body>
</html>
