<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Assistant</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #fff;
        --text: #333;
        --border: #ccc;
        --input-bg: #fff;
        --user: #4da3ff;
        --code-bg: #f4f4f4;
        --code-text: #333;
        --blockquote: #666;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --text: #e0e0e0;
          --border: #444;
          --input-bg: #2a2a2a;
          --user: #4da3ff;
          --code-bg: #2a2a2a;
          --code-text: #e0e0e0;
          --blockquote: #999;
        }
      }
      body {
        font-family: system-ui;
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
      }
      input,
      select,
      button,
      textarea {
        width: 100%;
        padding: 8px;
        margin: 4px 0;
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border);
      }
      textarea {
        height: 80px;
        resize: none;
      }
      #messages {
        height: 500px;
        overflow-y: auto;
        border: 1px solid var(--border);
        padding: 10px;
        margin: 10px 0;
        background: var(--bg);
      }
      .msg {
        margin: 8px 0;
        line-height: 1.5;
      }
      .msg.user {
        color: var(--user);
      }
      .msg.assistant {
        color: var(--text);
      }
      .msg.assistant p { margin: 0.5em 0; }
      .msg.assistant code { background: var(--code-bg); color: var(--code-text); padding: 2px 4px; border-radius: 3px; }
      .msg.assistant pre { background: var(--code-bg); padding: 10px; border-radius: 5px; overflow-x: auto; }
      .msg.assistant pre code { background: none; padding: 0; }
      .msg.assistant ul, .msg.assistant ol { padding-left: 20px; }
      .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { margin-top: 0.5em; }
      .msg.assistant blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--blockquote); }
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 280px;
        height: 100%;
        background: var(--input-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        z-index: 10;
      }
      #main { margin-left: 290px; max-width: 900px; }
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-header h3 { font-size: 16px; font-weight: 600; margin: 0; }
      .sidebar-actions { display: flex; gap: 6px; }
      .sidebar-actions button {
        width: 32px; height: 32px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }
      .sidebar-actions button:hover { background: var(--code-bg); }
      #sidebarSearch {
        margin: 8px 12px; padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        width: auto;
      }
      #sidebarSearch::placeholder { color: var(--blockquote); }
      #conversations {
        flex: 1;
        overflow-y: auto;
        padding: 4px 8px;
      }
      .conv-item {
        display: block;
        width: 100%;
        padding: 10px 12px;
        cursor: pointer;
        border-radius: 8px;
        margin: 2px 0;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--text);
        transition: background 0.15s;
      }
      .conv-item:hover { background: var(--code-bg); }
      .conv-item.active { background: var(--user); color: #fff; }
      .conv-item.active .conv-delete:hover { background: rgba(255,255,255,0.2); }
      .conv-title {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-preview {
        font-size: 12px;
        opacity: 0.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
      }
      .conv-time { font-size: 11px; opacity: 0.5; }
      .conv-delete {
        opacity: 0;
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .conv-item:hover .conv-delete { opacity: 0.5; }
      .conv-delete:hover { opacity: 1 !important; background: rgba(255,0,0,0.15); }
      .conv-item.active .conv-delete:hover { background: rgba(255,255,255,0.2); }
      .update-btn {
        margin: 8px 12px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
        flex-shrink: 0;
        width: calc(100% - 24px);
        white-space: nowrap;
      }
      .update-btn:hover { background: var(--code-bg); }
      #contextSources { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0; }
      #contextSources label { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; user-select: none; }
      #contextSources input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; }
      .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
      .tab { padding: 10px 20px; cursor: pointer; border: 1px solid var(--border); border-radius: 4px; background: var(--input-bg); }
      .tab.active { background: var(--user); color: #fff; }
      .tab-content { display: none; }
      .tab-content.active { display: block; }
      fieldset { border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin: 10px 0; }
      legend { font-weight: bold; padding: 0 5px; }
      .cat-item { border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin: 10px 0; }
      .cat-name { font-weight: bold; font-size: 1.1em; }
      .cat-summary { margin: 5px 0; color: var(--blockquote); }
      .cat-summary p { margin: 0.5em 0; }
      .cat-summary code { background: var(--code-bg); color: var(--code-text); padding: 2px 4px; border-radius: 3px; }
      .cat-summary pre { background: var(--code-bg); padding: 10px; border-radius: 5px; overflow-x: auto; }
      .cat-summary pre code { background: none; padding: 0; }
      .cat-summary ul, .cat-summary ol { padding-left: 20px; }
      .cat-summary h1, .cat-summary h2, .cat-summary h3 { margin-top: 0.5em; }
      .cat-summary blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--blockquote); }
      .topic-item { margin: 5px 0 5px 15px; }
      .topic-name { font-weight: bold; }
      .topic-summary { color: var(--blockquote); font-size: 0.9em; }
      .topic-summary p { margin: 0.5em 0; }
      .topic-summary code { background: var(--code-bg); color: var(--code-text); padding: 2px 4px; border-radius: 3px; }
      .topic-summary pre { background: var(--code-bg); padding: 10px; border-radius: 5px; overflow-x: auto; }
      .topic-summary pre code { background: none; padding: 0; }
      .topic-summary ul, .topic-summary ol { padding-left: 20px; }
      .topic-summary h1, .topic-summary h2, .topic-summary h3 { margin-top: 0.5em; }
      .topic-summary blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--blockquote); }

      /* Collapsible Explore Tab */
      .cat-header, .topic-header { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 10px; background: var(--input-bg); border-radius: 6px; user-select: none; margin-bottom: 4px; }
      .cat-header:hover, .topic-header:hover { background: var(--code-bg); }
      .cat-header .icon, .topic-header .icon { font-weight: bold; font-family: monospace; }
      .cat-header .cat-title, .topic-header .topic-title { flex: 1; font-weight: bold; }
      .cat-header .chevron, .topic-header .chevron { font-size: 0.8em; transition: transform 0.2s; color: var(--blockquote); }
      .cat-header.collapsed .chevron, .topic-header.collapsed .chevron { transform: rotate(-90deg); }
      .cat-body, .topic-body { padding: 10px 10px 10px 20px; border-left: 2px solid var(--border); margin-left: 12px; }
      .cat-body.collapsed, .topic-body.collapsed { display: none; }
      .topic-header { font-size: 0.9em; padding: 8px; background: transparent; }
      .topic-header:hover { background: var(--code-bg); }
      .cat-item { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden; }

      .chip-input {
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        margin: 4px 0;
        background: var(--input-bg);
        cursor: text;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        min-height: 36px;
        position: relative;
      }
      .chip-input:focus-within { border-color: var(--user); }
      .chip-list { display: contents; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.4;
        white-space: nowrap;
        cursor: default;
      }
      .chip.primary { background: var(--user); color: #fff; }
      .chip.context { background: var(--code-bg); color: var(--text); border: 1px solid var(--border); }
      .chip-remove {
        cursor: pointer;
        opacity: 0.6;
        font-size: 14px;
        line-height: 1;
        margin-left: 2px;
      }
      .chip-remove:hover { opacity: 1; }
      .chip-input input {
        border: none;
        outline: none;
        flex: 1;
        min-width: 120px;
        padding: 4px;
        margin: 0;
        background: transparent;
        color: var(--text);
        font-size: 13px;
      }
      .chat-section { margin-bottom: 8px; }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.6;
        margin-bottom: 2px;
      }
      .about-box {
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        background: var(--input-bg);
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        position: relative;
      }
      .about-box:focus-within { border-color: var(--user); }
      .about-chip {
        display: none;
        align-items: center;
        gap: 4px;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.4;
        background: var(--user);
        color: #fff;
        white-space: nowrap;
      }
      .about-box.has-chip .about-chip { display: inline-flex; }
      .about-box.has-chip .about-input { display: none; }
      .about-input {
        border: none;
        outline: none;
        flex: 1;
        min-width: 120px;
        padding: 4px;
        margin: 0;
        background: transparent;
        color: var(--text);
        font-size: 13px;
      }
      .suggestions-below {
        position: relative;
      }
      .suggestions-below .chip-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 100;
      }
      .chip-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-top: none;
        border-radius: 0 0 4px 4px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 100;
        display: none;
      }
      .chip-suggestions.visible { display: block; }
      .chip-suggestion {
        padding: 6px 10px;
        cursor: pointer;
        font-size: 13px;
      }
      .chip-suggestion:hover,
      .chip-suggestion.highlighted { background: var(--code-bg); }
      .chip-suggestion .sug-label { font-weight: 500; }
      .chip-suggestion .sug-type {
        font-size: 11px;
        opacity: 0.6;
        margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="sidebar-header">
        <h3>Conversations</h3>
        <div class="sidebar-actions">
          <button onclick="newConversation()" title="New conversation">+</button>
        </div>
      </div>
      <input id="sidebarSearch" type="text" placeholder="Search conversations..." oninput="renderConversations()" />
      <div id="conversations"></div>
      <button class="update-btn" onclick="updateSummaries()"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="vertical-align:middle;margin-right:4px"><path d="M2 7a5 5 0 0110 0M12 2v4.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Update Summaries</button>
    </div>
    <div id="main">
    <h1>Personal Assistant</h1>
    <details style="margin-bottom:10px">
      <summary style="cursor:pointer;user-select:none;font-size:14px;color:var(--blockquote)">Keys</summary>
      <input id="apiKey" type="password" placeholder="API Key" />
      <input id="kanbanApiKey" type="password" placeholder="KanbanFlow API Key (optional, for manual override)" />
    </details>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('chat')">Chat</button>
      <button class="tab" onclick="switchTab('query')">Query</button>
      <button class="tab" onclick="switchTab('explore')">Explore</button>
      <button class="tab" onclick="switchTab('data')">Data</button>
      <button class="tab" onclick="switchTab('kanban')">Kanban</button>
    </div>
    <div id="tab-chat" class="tab-content active">
      <div class="chat-section">
        <div class="section-label">Conversation About</div>
        <div class="about-box" id="aboutBox">
          <span class="about-chip" id="aboutChip">
            <span id="aboutChipLabel"></span>
            <span class="chip-remove" id="aboutChipRemove" onclick="clearAboutChip()">x</span>
          </span>
          <input id="aboutInput" class="about-input" type="text" placeholder="Enter topic... (e.g. Work > ProjectX)" autocomplete="off" />
          <div id="aboutSuggestions" class="chip-suggestions"></div>
        </div>
      </div>
      <div class="chat-section">
        <div class="section-label">Additional Context (optional)</div>
        <div id="contextChips" class="chip-input">
          <div class="chip-list" id="contextList"></div>
          <input id="contextInput" type="text" placeholder="Add category or topic..." autocomplete="off" />
          <div id="contextSuggestions" class="chip-suggestions"></div>
        </div>
      </div>
      <textarea id="message" placeholder="Message"></textarea>
      <div id="contextSources"></div>
      <div style="display:flex;gap:6px;align-items:center">
        <button id="sendBtn" onclick="send()" style="flex:1">Send</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none">
          <input type="checkbox" id="noteMode" onchange="toggleNoteMode()" style="width:auto;margin:0" />
          Save as note
        </label>
      </div>
      <div id="messages"></div>
    </div>
    <div id="tab-query" class="tab-content">
      <fieldset>
        <legend>Query Topic</legend>
        <select id="qTopicCategory">
          <option value="">Select Category</option>
        </select>
        <select id="qTopicName">
          <option value="">Select Topic</option>
        </select>
        <textarea id="qTopicPrompt" placeholder="Prompt"></textarea>
        <button onclick="queryTopic()">Query Topic</button>
      </fieldset>
      <fieldset>
        <legend>Query Category</legend>
        <select id="qCategoryName">
          <option value="">Select Category</option>
        </select>
        <textarea id="qCategoryPrompt" placeholder="Prompt"></textarea>
        <button onclick="queryCategory()">Query Category</button>
      </fieldset>
      <div id="queryResults"></div>
    </div>
    <div id="tab-explore" class="tab-content">
      <div id="exploreList"></div>
    </div>
    <div id="tab-data" class="tab-content">
      <fieldset>
        <legend>Export</legend>
        <button id="exportBtn" onclick="exportData()">Export All Data</button>
        <div id="exportResult"></div>
      </fieldset>
      <fieldset>
        <legend>Import</legend>
        <input type="file" id="importFile" accept=".json" onchange="previewImport()" />
        <div id="importPreview" style="font-size:13px"></div>
        <button id="importBtn" onclick="importData()" disabled>Import</button>
        <div id="importResult"></div>
      </fieldset>
    </div>
    <div id="tab-kanban" class="tab-content">
      <fieldset>
          <legend>Add Task</legend>
          <select id="kanbanColumn"><option value="">Select column</option></select>
          <input id="kanbanTaskName" placeholder="Task name" />
          <input id="kanbanCategory" placeholder="Category (leave empty to auto-generate)" />
          <input id="kanbanTopic" placeholder="Topic (leave empty to auto-generate)" />
          <button id="kanbanAddBtn" onclick="createKanbanTask()">Add Task</button>
          <div id="kanbanCreateResult"></div>
      </fieldset>
      <fieldset>
        <legend>Rundown</legend>
        <textarea id="kanbanPrompt" placeholder="Custom prompt (optional — defaults to asking for a rundown and starting advice)">What's on my plate today and what should I prioritize?</textarea>
        <button onclick="generateKanbanRundown()">Generate Kanban Rundown</button>
        <div id="kanbanResults"></div>
      </fieldset>
    </div>
    </div>
    <script>
      const base = location.origin
      const msgs = document.getElementById("messages")
      const apiKey = document.getElementById("apiKey")
      const message = document.getElementById("message")

      const aboutInput = document.getElementById("aboutInput")
      const aboutBox = document.getElementById("aboutBox")
      const aboutChip = document.getElementById("aboutChip")
      const aboutChipLabel = document.getElementById("aboutChipLabel")
      const aboutSuggestions = document.getElementById("aboutSuggestions")
      const contextInput = document.getElementById("contextInput")
      const contextList = document.getElementById("contextList")
      const contextSuggestions = document.getElementById("contextSuggestions")

      let aboutChipValue = null
      let contextChips = []
      let autocompleteOptions = []
      let highlightedIndex = -1
      let activeSuggestions = null

      function buildAutocompleteOptions() {
        const options = []
        for (const cat of categoriesData) {
          options.push({ label: cat.name, category: cat.name, topic: null, type: "category" })
          for (const topic of cat.topics) {
            options.push({ label: `${cat.name} > ${topic.name}`, category: cat.name, topic: topic.name, type: "topic" })
          }
        }
        return options
      }

      function renderAboutChip() {
        if (aboutChipValue) {
          aboutBox.classList.add("has-chip")
          aboutChipLabel.textContent = `${aboutChipValue.category} > ${aboutChipValue.topic}`
        } else {
          aboutBox.classList.remove("has-chip")
        }
        updateSendButton()
      }

      function renderContextChips() {
        contextList.innerHTML = contextChips.map((chip, i) => {
          const label = chip.topic ? `${chip.category} > ${chip.topic}` : chip.category
          return `<span class="chip context">${escapeHtml(label)}<span class="chip-remove" data-index="${i}">x</span></span>`
        }).join("")
      }

      function setAboutChip(category, topic) {
        aboutChipValue = category && topic ? { category, topic } : null
        renderAboutChip()
        aboutInput.value = ""
        hideSuggestions(aboutSuggestions)
        aboutInput.blur()
      }

      function commitAboutInput(text) {
        const trimmed = text.trim()
        if (!trimmed) return
        const sepIndex = trimmed.indexOf(" > ")
        if (sepIndex !== -1) {
          setAboutChip(trimmed.slice(0, sepIndex).trim(), trimmed.slice(sepIndex + 3).trim())
        } else {
          setAboutChip(trimmed, trimmed)
        }
      }

      function clearAboutChip() {
        setAboutChip(null, null)
        aboutInput.focus()
      }

      function addContextChip(category, topic) {
        if (!category) return
        const exists = contextChips.some(c => c.category.toLowerCase() === category.toLowerCase() && (c.topic || "").toLowerCase() === (topic || "").toLowerCase())
        if (exists) return
        contextChips.push({ category, topic: topic || null })
        renderContextChips()
        contextInput.value = ""
        hideSuggestions(contextSuggestions)
        contextInput.focus()
      }

      function removeContextChip(index) {
        contextChips.splice(index, 1)
        renderContextChips()
      }

      function clearAllChips() {
        aboutChipValue = null
        contextChips = []
        renderAboutChip()
        renderContextChips()
      }

      function setChipsFromData(primaryCategory, primaryTopic, contextCategories) {
        aboutChipValue = primaryCategory && primaryTopic ? { category: primaryCategory, topic: primaryTopic } : null
        contextChips = []
        if (Array.isArray(contextCategories)) {
          for (const ctx of contextCategories) {
            if (ctx.category && !contextChips.some(c => c.category === ctx.category && c.topic === (ctx.topic || null))) {
              contextChips.push({ category: ctx.category, topic: ctx.topic || null })
            }
          }
        }
        renderAboutChip()
        renderContextChips()
      }

      function filterSuggestions(query) {
        if (!query.trim()) return autocompleteOptions
        const q = query.toLowerCase()
        return autocompleteOptions.filter(o =>
          o.label.toLowerCase().includes(q) ||
          o.category.toLowerCase().includes(q) ||
          (o.topic && o.topic.toLowerCase().includes(q))
        )
      }

      function showSuggestions(suggestionsEl, results) {
        if (!results.length) { hideSuggestions(suggestionsEl); return }
        highlightedIndex = -1
        activeSuggestions = suggestionsEl
        suggestionsEl.innerHTML = results.map((r, i) =>
          `<div class="chip-suggestion" data-index="${i}"><span class="sug-label">${escapeHtml(r.label)}</span><span class="sug-type">${r.type === "category" ? "category" : "topic"}</span></div>`
        ).join("")
        suggestionsEl.classList.add("visible")
      }

      function hideSuggestions(suggestionsEl) {
        if (suggestionsEl) suggestionsEl.classList.remove("visible")
        highlightedIndex = -1
        activeSuggestions = null
      }

      function getHighlightedSuggestion(suggestionsEl) {
        const items = suggestionsEl.querySelectorAll(".chip-suggestion")
        if (highlightedIndex >= 0 && highlightedIndex < items.length) {
          return { el: items[highlightedIndex], index: highlightedIndex }
        }
        return null
      }

      function selectSuggestion(suggestionsEl, index) {
        const items = suggestionsEl.querySelectorAll(".chip-suggestion")
        if (index < 0 || index >= items.length) return
        const dataIndex = parseInt(items[index].dataset.index)
        const inputValue = suggestionsEl === aboutSuggestions ? aboutInput.value : contextInput.value
        let results = filterSuggestions(inputValue)
        if (suggestionsEl === aboutSuggestions) {
          results = results.filter(r => r.type === "topic")
        }
        const option = results[dataIndex]
        if (!option) return

      function setupInput(inputEl, suggestionsEl, opts) {
        inputEl.addEventListener("input", function() {
          document.getElementById("sendBtn").textContent = "Send"
          let results = filterSuggestions(this.value)
          if (opts.onlyTopics) results = results.filter(r => r.type === "topic")
          showSuggestions(suggestionsEl, results)
        })

        inputEl.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault()
            const highlighted = getHighlightedSuggestion(suggestionsEl)
            if (highlighted) {
              selectSuggestion(suggestionsEl, highlighted.index)
            } else if (this.value.trim()) {
              const query = this.value
              let results = filterSuggestions(query)
              if (opts.onlyTopics) results = results.filter(r => r.type === "topic")
              const first = results[0]
              if (first) {
                if (suggestionsEl === aboutSuggestions) {
                  setAboutChip(first.category, first.topic)
                } else {
                  addContextChip(first.category, first.topic)
                }
              } else if (suggestionsEl === aboutSuggestions) {
                commitAboutInput(query)
              } else {
                addContextChip(query, null)
              }
            }
          } else if (e.key === "Backspace" && !this.value && suggestionsEl === contextSuggestions && contextChips.length) {
            removeContextChip(contextChips.length - 1)
          } else if (e.key === "ArrowDown") {
            e.preventDefault()
            const items = suggestionsEl.querySelectorAll(".chip-suggestion")
            items.forEach(el => el.classList.remove("highlighted"))
            highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1)
            if (highlightedIndex >= 0) items[highlightedIndex]?.classList.add("highlighted")
          } else if (e.key === "ArrowUp") {
            e.preventDefault()
            const items = suggestionsEl.querySelectorAll(".chip-suggestion")
            items.forEach(el => el.classList.remove("highlighted"))
            highlightedIndex = Math.max(highlightedIndex - 1, -1)
            if (highlightedIndex >= 0) items[highlightedIndex]?.classList.add("highlighted")
          } else if (e.key === "Escape") {
            hideSuggestions(suggestionsEl)
          }
        })

        inputEl.addEventListener("blur", function() {
          setTimeout(() => hideSuggestions(suggestionsEl), 150)
        })

        inputEl.addEventListener("focus", function() {
          if (this.value.trim()) {
            let results = filterSuggestions(this.value)
            if (opts.onlyTopics) results = results.filter(r => r.type === "topic")
            showSuggestions(suggestionsEl, results)
          }
        })

        suggestionsEl.addEventListener("mousedown", function(e) {
          const item = e.target.closest(".chip-suggestion")
          if (item) {
            e.preventDefault()
            selectSuggestion(suggestionsEl, parseInt(item.dataset.index))
          }
        })

        inputEl.addEventListener("click", function() {
          if (this.value.trim()) {
            let results = filterSuggestions(this.value)
            if (opts.onlyTopics) results = results.filter(r => r.type === "topic")
            showSuggestions(suggestionsEl, results)
          }
        })
      }

      /**
       * Converts a unix timestamp to a relative time string (e.g. "5m ago").
       * @param {number} timestamp - Unix timestamp in seconds
       * @returns {string}
       */
      function relativeTime(timestamp) {
        const now = Math.floor(Date.now() / 1000)
        const diff = now - timestamp
        if (diff < 60) return "just now"
        if (diff < 3600) return Math.floor(diff / 60) + "m ago"
        if (diff < 86400) return Math.floor(diff / 3600) + "h ago"
        if (diff < 172800) return "yesterday"
        if (diff < 604800) return Math.floor(diff / 86400) + "d ago"
        return new Date(timestamp * 1000).toLocaleDateString()
      }

        msgs.innerHTML = '<div class="msg">Loading...</div>'
        const res = await req("GET", `/conversation?id=${id}`)

      /**
       * Escapes HTML special characters in a string.
       * @param {string} text
       * @returns {string}
       */
      function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      }

      /**
       * Converts basic markdown text to safe HTML.
       * @param {string} text
       * @returns {string}
       */
      function parseMarkdown(text) {
        text = escapeHtml(text)
        text = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>')
        text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>')
        text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>')
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        text = text.replace(/\*(.+?)\*/g, '<em>$1</em>')
        text = text.replace(/`(.+?)`/g, '<code>$1</code>')
        text = text.replace(/^\* (.+)$/gm, '<li>$1</li>')
        text = text.replace(/(<li>.*?<\/li>)/gs, '<ul>$1</ul>')
        text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        text = text.replace(/\n/g, '<br>')
        return text
      }

      /**
       * Reads the selected JSON import file, validates its structure, and shows a preview
       * of categories/topics/conversations counts. Enables the Import button on success.
       * @returns {Promise<void>}
       */
      async function previewImport() {
        const fileInput = document.getElementById("importFile")
        const preview = document.getElementById("importPreview")
        const importBtn = document.getElementById("importBtn")
        const file = fileInput.files?.[0]
        if (!file) {
          importBtn.disabled = true
          preview.innerHTML = ""
          return
        }
        try {
          const text = await file.text()
          const data = JSON.parse(text)
          if (!data.categories) throw new Error("Invalid format: missing categories array")
          const catCount = data.categories.length
          const topicCount = data.categories.reduce((s, c) => s + (c.topics?.length || 0), 0)
          const convCount = data.categories.reduce((s, c) => s + c.topics.reduce((s2, t) => s2 + (t.conversations?.length || 0), 0), 0)
          preview.innerHTML = `<span>Found <b>${catCount}</b> categories, <b>${topicCount}</b> topics, <b>${convCount}</b> conversations. Existing items will be preserved, new ones added.</span>`
          importBtn.disabled = false
        } catch (err) {
          preview.innerHTML = `<span style="color:red">Invalid file: ${err.message}</span>`
          importBtn.disabled = true
        }
      }

      /**
       * Reads the selected JSON file and sends it to /import. Displays imported counts
       * and any conflicts (items skipped because they already exist). Refreshes categories
       * and conversations on success.
       * @returns {Promise<void>}
       */
      async function importData() {
        const fileInput = document.getElementById("importFile")
        const result = document.getElementById("importResult")
        const importBtn = document.getElementById("importBtn")
        const file = fileInput.files?.[0]
        if (!file) return
        importBtn.disabled = true
        importBtn.textContent = "Importing..."
        result.innerHTML = '<div class="msg">Importing data...</div>'
        try {
          const text = await file.text()
          const data = JSON.parse(text)
          const res = await req("POST", "/import", { data })
          const imported = res.imported || {}
          const conflicts = res.conflicts || {}
          const conflictItems = [...(conflicts.categories || []), ...(conflicts.topics || [])]
          const conflictItemsEscaped = conflictItems.map(i => escapeHtml(String(i))).join(", ")
          result.innerHTML = `<div class="msg assistant">Imported: ${imported.categories || 0} categories, ${imported.topics || 0} topics, ${imported.conversations || 0} conversations${conflictItems.length ? `<br><span style="opacity:0.7;font-size:13px">Skipped (already exist): ${conflictItemsEscaped}</span>` : ""}</div>`
          loadCategories()
          refreshConversations()
        } catch (err) {
          result.innerHTML = `<div class="msg" style="color:red">Error: ${err.message}</div>`
        }
        importBtn.disabled = false
        importBtn.textContent = "Import"
      }
    </script>
  </body>
</html>
