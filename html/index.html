<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawmc: Private Assistant with Managed Context</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181b;
      --surface2: #222226;
      --border: #2e2e34;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --accent: #7c6af7;
      --accent-hover: #6c5ce7;
      --accent-muted: #2d2755;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --orange: #f97316;
      --radius: 8px;
      --radius-sm: 5px;
      --transition: 150ms ease;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Auth overlay ── */
    #auth-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 340px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .auth-card h2 { font-size: 18px; font-weight: 600; }
    .auth-card p { color: var(--text-muted); font-size: 13px; }
    .auth-card input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      width: 100%;
      outline: none;
    }
    .auth-card input:focus { border-color: var(--accent); }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo { font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: -0.3px; }

    .topic-picker {
      flex: 1;
      display: flex; align-items: center; gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      cursor: pointer;
      transition: border-color var(--transition);
      min-width: 0;
    }
    .topic-picker:hover { border-color: var(--accent); }
    .topic-picker .label {
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 13px;
    }
    .topic-picker .label.placeholder { color: var(--text-muted); }
    .topic-picker svg { flex-shrink: 0; color: var(--text-dim); }

    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: none; border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
      position: relative;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--border); background: var(--surface2); }
    .icon-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute; top: calc(100% + 6px); left: 50%;
      transform: translateX(-50%);
      background: #333; color: var(--text);
      font-size: 11px; white-space: nowrap;
      padding: 3px 7px; border-radius: 4px;
      pointer-events: none; opacity: 0;
      transition: opacity var(--transition);
      z-index: 50;
    }
    .icon-btn[data-tooltip]:hover::after { opacity: 1; }

    /* ── Main layout ── */
    .main {
      flex: 1; display: flex; min-height: 0;
    }

    /* ── Sidebar / Browse panel ── */
    #sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: transform var(--transition), opacity var(--transition);
    }
    #sidebar.hidden { display: none; }
    .sidebar-header {
      padding: 12px 14px 10px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .sidebar-search {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text); padding: 5px 8px;
      font-size: 12px; outline: none;
    }
    .sidebar-search input:focus { border-color: var(--accent); }

    .sidebar-slider {
      padding: 5px 14px 8px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .sidebar-slider input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .sidebar-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 1px var(--border);
    }
    .sidebar-slider input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 1px var(--border);
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
    }
    .slider-label {
      font-size: 10px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      transition: color var(--transition);
    }
    .slider-label.active {
      color: var(--text-muted);
    }
    .slider-label[data-idx="0"].active { color: var(--green); }
    .slider-label[data-idx="1"].active { color: var(--yellow); }
    .slider-label[data-idx="2"].active { color: var(--orange); }
    .slider-label[data-idx="3"].active { color: var(--text); }
    .slider-tooltip {
      position: absolute;
      top: -6px;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity var(--transition), left 100ms ease;
    }
    .slider-tooltip.hidden { opacity: 0; }

    .sidebar-list {
      flex: 1; overflow-y: auto;
      padding: 6px 0;
    }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .sidebar-empty {
      font-size: 13px; color: var(--text-dim); text-align: center;
      padding: 24px 16px; line-height: 1.5;
    }
    .sidebar-empty strong { color: var(--text-muted); }

    .cat-group { }
    .cat-header {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 12px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      user-select: none;
    }
    .cat-header:hover { color: var(--text); }
    .cat-header svg { flex-shrink: 0; transition: transform var(--transition); }
    .cat-header.collapsed svg { transform: rotate(-90deg); }

    .topic-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 14px 5px 28px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      margin: 0 6px;
      font-size: 13px;
      color: var(--text-muted);
      transition: all var(--transition);
      position: relative;
    }
    .topic-item:hover { background: var(--surface2); color: var(--text); }
    .topic-item.active { background: var(--accent-muted); color: var(--accent); font-weight: 500; }
    .freshness-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .fresh-high { background: var(--green); }
    .fresh-mid  { background: var(--yellow); }
    .fresh-low  { background: var(--orange); }
    .fresh-none { background: var(--text-dim); }

    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
    }

    /* ── Context preview ── */
    #context-preview {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .context-toggle {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
      font-size: 12px; color: var(--text-muted);
    }
    .context-toggle:hover { color: var(--text); }
    .context-toggle .chevron { transition: transform var(--transition); }
    .context-toggle .chevron.open { transform: rotate(180deg); }

    .context-body {
      padding: 0 16px 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .context-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .context-card-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .context-card-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .context-card-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .meta-tag {
      font-size: 10px; color: var(--text-dim);
      background: var(--surface2); border-radius: 3px;
      padding: 1px 5px;
    }
    .context-text {
      font-size: 13px; color: var(--text-muted); line-height: 1.5;
    }
    .context-empty { font-size: 12px; color: var(--text-dim); font-style: italic; }
    .context-actions {
      display: flex; gap: 8px; margin-top: 8px;
    }
    .ctx-action-btn {
      background: none; border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted); cursor: pointer;
      font-size: 11px; padding: 3px 8px;
      transition: all var(--transition);
    }
    .ctx-action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ctx-action-btn.danger:hover { border-color: var(--red); color: var(--red); }

    /* ── Inline edit textarea ── */
    .inline-edit {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      color: var(--text); padding: 8px;
      font-size: 13px; font-family: inherit;
      resize: vertical; min-height: 60px;
      outline: none; margin-top: 6px;
    }
    .inline-edit-actions { display: flex; gap: 6px; margin-top: 6px; }

    /* ── Messages ── */
    .messages {
      flex: 1; overflow-y: auto;
      padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex; gap: 10px; max-width: 720px;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px; line-height: 1.6;
      max-width: 600px; word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }
    .msg-bubble pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      overflow-x: auto;
      font-size: 12px;
      margin: 6px 0;
    }
    .msg-bubble code {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
    }
    .msg-bubble p { margin-bottom: 6px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-note { opacity: 0.6; font-style: italic; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.user .msg-avatar { background: var(--accent-muted); color: var(--accent); }
    .msg.assistant .msg-avatar { background: var(--surface2); color: var(--text-muted); }

    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: var(--text-dim);
      text-align: center; padding: 24px;
    }
    .empty-state h3 { font-size: 16px; color: var(--text-muted); font-weight: 500; }
    .empty-state p { font-size: 13px; max-width: 280px; line-height: 1.5; }

    .typing-indicator {
      display: flex; gap: 4px; align-items: center;
      padding: 10px 14px;
    }
    .typing-indicator span {
      width: 6px; height: 6px; background: var(--text-dim);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* ── Input area ── */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-area-top {
      display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px;
    }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
    }
    textarea#msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px; font-family: inherit;
      resize: none;
      line-height: 1.5;
      min-height: 44px; max-height: 160px;
      outline: none;
      transition: border-color var(--transition);
    }
    textarea#msg-input:focus { border-color: var(--accent); }
    textarea#msg-input::placeholder { color: var(--text-dim); }

    .send-btn {
      background: var(--accent);
      border: none; border-radius: var(--radius);
      color: #fff; cursor: pointer;
      padding: 10px 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), opacity var(--transition);
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* input options row */
    .input-options {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .opt-chip {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px;
      font-size: 11px; color: var(--text-muted);
      cursor: pointer; user-select: none;
      transition: all var(--transition);
    }
    .opt-chip:hover { border-color: var(--accent); color: var(--text); }
    .opt-chip.active { background: var(--accent-muted); border-color: var(--accent); color: var(--accent); }
    .opt-chip input[type=checkbox] { display: none; }

    .context-src-list {
      display: flex; gap: 6px; flex-wrap: wrap;
    }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 80;
    }
    .modal-backdrop.hidden { display: none; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 420px; max-width: 95vw;
      display: flex; flex-direction: column; gap: 16px;
    }
    .modal h3 { font-size: 16px; font-weight: 600; }
    .modal label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .modal input, .modal select, .modal textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px; font-family: inherit;
      outline: none;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
    .modal select option { background: var(--bg); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; }

    /* ── Buttons ── */
    .btn {
      background: none; border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted); cursor: pointer;
      font-size: 13px; padding: 7px 14px;
      transition: all var(--transition);
    }
    .btn:hover { border-color: var(--text-muted); color: var(--text); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: #fff; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 16px; font-size: 13px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }
    #toast.show { opacity: 1; }

    /* ── Conversations panel ── */
    .conv-list { display: flex; flex-direction: column; gap: 4px; }
    .conv-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition);
    }
    .conv-item:hover { background: var(--surface2); }
    .conv-item-body { flex: 1; min-width: 0; }
    .conv-item-topic { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item-preview { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .conv-item-time { font-size: 10px; color: var(--text-dim); flex-shrink: 0; }
    .conv-delete-btn {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; padding: 3px; border-radius: 3px;
      opacity: 0; transition: opacity var(--transition);
    }
    .conv-item:hover .conv-delete-btn { opacity: 1; }
    #conv-picker-body .conv-item-preview { color: var(--text); font-size: 13px; }
    .conv-delete-btn:hover { color: var(--red); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      #sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 60; }
      #sidebar.hidden { transform: translateX(-100%); display: flex; }
    }
  </style>
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay">
  <div class="auth-card">
    <h2>Pawmc</h2>
    <p>Enter your API key to continue.</p>
    <input type="password" id="api-key-input" placeholder="Bearer token" autocomplete="current-password" />
    <button class="btn primary" id="auth-submit-btn">Continue</button>
  </div>
</div>

<!-- Header -->
<header>
  <span class="logo">Pawmc</span>
  <button class="icon-btn" id="browse-btn" data-tooltip="Browse topics &amp; memory">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
  </button>

  <div class="topic-picker" id="topic-picker" data-tooltip="Pick a topic to chat about">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="label placeholder" id="topic-picker-label">Select a topic…</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <div class="header-actions">
    <button class="icon-btn" id="update-summaries-btn" data-tooltip="Refresh all summaries now">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <button class="icon-btn" id="settings-btn" data-tooltip="Settings">

<!-- Toast -->
<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ── State ──────────────────────────────────────────────────────────────
  const state = {
    apiKey: "",
    endpoint: "",
    category: "",
    topic: "",
    topicId: null,
    categoryId: null,
    categories: [],
    contextSources: [],
    activeContextSources: [],
    messages: [],
    loading: false,
    contextOpen: false,
    sidebarFreshnessLevel: 0,
  };

  // ── Persistence ─────────────────────────────────────────────────────────
  function loadSettings() {
    state.apiKey = localStorage.getItem("pa_api_key") || "";
    state.endpoint = window.location.origin;
    state.sidebarFreshnessLevel = +(localStorage.getItem("pa_freshness") || 0);
  }
  function saveSettings() {
    localStorage.setItem("pa_api_key", state.apiKey);
    localStorage.setItem("pa_freshness", state.sidebarFreshnessLevel);
  }

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const authOverlay     = $("auth-overlay");
  const authSubmitBtn   = $("auth-submit-btn");
  const apiKeyInput     = $("api-key-input");
  const topicPickerEl   = $("topic-picker");
  const topicPickerLbl  = $("topic-picker-label");
  const browseBtn       = $("browse-btn");
  const updateSumBtn    = $("update-summaries-btn");
  const convPicker       = $("conversation-picker");
  const convPickerToggle = $("conv-picker-toggle");
  const convPickerChevron= $("conv-picker-chevron");
  const convPickerBody   = $("conv-picker-body");
  const convPickerLbl    = $("conv-picker-label");
  const settingsBtn     = $("settings-btn");
  const sidebar         = $("sidebar");
  const sidebarCloseBtn = $("sidebar-close-btn");
  const sidebarList     = $("sidebar-list");
  const sidebarSearch   = $("sidebar-search");
  const newTopicBtn     = $("new-topic-btn");
  const contextToggle   = $("context-toggle");
  const contextChevron  = $("context-chevron");
  const contextBody     = $("context-body");
  const contextToggleLbl= $("context-toggle-label");
  const messagesEl      = $("messages");
  const emptyState      = $("empty-state");
  const msgInput        = $("msg-input");
  const sendBtn         = $("send-btn");
  const noteChip        = $("note-chip");
  const noteModeToggle  = $("note-mode-toggle");
  const contextSrcChips = $("context-src-chips");
  const topicModal      = $("topic-modal");
  const historyModal    = $("history-modal");
  const settingsModal   = $("settings-modal");
  const toastEl         = $("toast");

  // ── API ──────────────────────────────────────────────────────────────────
  async function api(method, path, body) {
    const opts = {
      method,
      headers: {
        "Authorization": `Bearer ${state.apiKey}`,
        "Content-Type": "application/json",
      },
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(state.endpoint + path, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
  }

  // ── Toast ─────────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg, type = "info") {
    toastEl.textContent = msg;
    toastEl.style.borderColor = type === "error" ? "var(--red)" : type === "success" ? "var(--green)" : "var(--border)";
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3000);
  }

  // ── Freshness util ────────────────────────────────────────────────────────
  function freshnessClass(ts) {
    if (!ts) return "fresh-none";
    const age = Date.now() / 1000 - ts;
    if (age < 86400) return "fresh-high";       // < 1 day
    if (age < 86400 * 7) return "fresh-mid";    // < 1 week
    if (age < 86400 * 30) return "fresh-low";   // < 1 month
    return "fresh-none";
  }
  function relativeTime(ts) {
    if (!ts) return "never";
    const age = Date.now() / 1000 - ts;
    if (age < 60) return "just now";
    if (age < 3600) return `${Math.floor(age / 60)}m ago`;
    if (age < 86400) return `${Math.floor(age / 3600)}h ago`;
    if (age < 86400 * 30) return `${Math.floor(age / 86400)}d ago`;
    return new Date(ts * 1000).toLocaleDateString();
  }

  // ── Simple markdown renderer ──────────────────────────────────────────────
  function renderMarkdown(text) {
    // code blocks
    text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`);
    // inline code
    text = text.replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`);
    // bold
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    // italic
    text = text.replace(/\*(.+?)\*/g, "<em>$1</em>");
    // newlines to paragraphs
    const paras = text.split(/\n\n+/).filter(Boolean);
    return paras.map(p => {
      if (p.startsWith("<pre>")) return p;
      return `<p>${p.replace(/\n/g, "<br>")}</p>`;
    }).join("");
  }
  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  loadSettings();
  if (state.apiKey) {
    authOverlay.style.display = "none";
    init();
  } else {
    apiKeyInput.focus();
    if (state.apiKey) apiKeyInput.value = state.apiKey;
  }

  authSubmitBtn.addEventListener("click", handleAuth);
  apiKeyInput.addEventListener("keydown", e => { if (e.key === "Enter") handleAuth(); });

  function handleAuth() {
    const val = apiKeyInput.value.trim();
    if (!val) { toast("Enter your API key", "error"); return; }
    state.apiKey = val;
    state.endpoint = window.location.origin;
    saveSettings();
    authOverlay.style.display = "none";
    init();
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    await Promise.all([loadCategories(), loadContextSources()]);
    renderSidebar();
  }

  // ── Categories ────────────────────────────────────────────────────────────
  async function loadCategories() {
    try {
      state.categories = await api("GET", "/categories");
    } catch (err) {
      toast("Couldn't load topics — " + err.message, "error");
    }
  }

  // ── Context sources ───────────────────────────────────────────────────────
  async function loadContextSources() {
    try {
      const sources = await api("GET", "/context-sources");
      state.contextSources = Array.isArray(sources) ? sources : [];
    } catch {
      state.contextSources = [];
    }
    renderContextSourceChips();
  }

  function renderContextSourceChips() {
    contextSrcChips.innerHTML = "";
    state.contextSources.forEach(src => {
      const chip = document.createElement("label");
      chip.className = "opt-chip";
      chip.setAttribute("data-tooltip", `Include ${src} context in this message`);
      chip.innerHTML = `<input type="checkbox" value="${escHtml(src)}" />${escHtml(src)}`;
      chip.querySelector("input").addEventListener("change", e => {
        if (e.target.checked) {
          state.activeContextSources.push(src);
        } else {
          state.activeContextSources = state.activeContextSources.filter(s => s !== src);
        }
        chip.classList.toggle("active", e.target.checked);
      });
      contextSrcChips.appendChild(chip);
    });
  }

  // ── Sidebar ────────────────────────────────────────────────────────────────
  function renderSidebar(filter = "") {
    sidebarList.innerHTML = "";
    if (!state.categories.length) {
      sidebarList.innerHTML = `<div class="sidebar-empty">No topics yet. Start a conversation or click <strong>New topic</strong> above to create one.</div>`;
      return;
    }
    const f = filter.toLowerCase();
    const cutoffs = [86400, 86400 * 7, 86400 * 30, Infinity];
    const cutoff = cutoffs[state.sidebarFreshnessLevel];
    const now = Date.now() / 1000;
    state.categories.forEach(cat => {
      const matchedTopics = cat.topics.filter(t => {
        if (f && !t.name.toLowerCase().includes(f) && !cat.name.toLowerCase().includes(f)) return false;
        if (cutoff < Infinity) {
          if (!t.updated_at_timestamp) return false;
          if (now - t.updated_at_timestamp >= cutoff) return false;
        }
        return true;
      });
      if (f && !matchedTopics.length) return;
      if (!f && cutoff < Infinity && !matchedTopics.length) return;

      const group = document.createElement("div");
      group.className = "cat-group";

      const header = document.createElement("div");
      header.className = "cat-header";
      header.innerHTML = `
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        ${escHtml(cat.name)}
        <span class="freshness-dot ${freshnessClass(cat.updated_at_timestamp)}" title="Category updated ${relativeTime(cat.updated_at_timestamp)}"></span>
      `;
      header.addEventListener("click", () => {
        header.classList.toggle("collapsed");
        topicsEl.style.display = header.classList.contains("collapsed") ? "none" : "block";
      });

      const topicsEl = document.createElement("div");
      matchedTopics.forEach(t => {
        const item = document.createElement("div");
        item.className = "topic-item" + (state.category === cat.name && state.topic === t.name ? " active" : "");
        item.innerHTML = `
          <span class="freshness-dot ${freshnessClass(t.updated_at_timestamp)}" title="Updated ${relativeTime(t.updated_at_timestamp)}"></span>
          ${escHtml(t.name)}
        `;
        item.addEventListener("click", () => selectTopic(cat, t));
        topicsEl.appendChild(item);
      });

      group.appendChild(header);
      group.appendChild(topicsEl);
      sidebarList.appendChild(group);
    });
  }

  sidebarSearch.addEventListener("input", e => renderSidebar(e.target.value));

  const tooltipLabels = ["\u003C 1 day", "\u003C 1 week", "\u003C 1 month", "All time"];

  const sliderEl = document.getElementById("freshness-slider");
  const tooltipEl = document.getElementById("slider-tooltip");
  const labelEls = document.querySelectorAll(".slider-label");

  function updateSliderUI() {
    const val = state.sidebarFreshnessLevel;
    sliderEl.value = val;
    tooltipEl.textContent = tooltipLabels[val];
    tooltipEl.style.left = ((val / 3) * 100) + "%";
    labelEls.forEach(el => {
      el.classList.toggle("active", +el.dataset.idx === val);
    });
  }
  updateSliderUI();

  sliderEl.addEventListener("input", () => {
    state.sidebarFreshnessLevel = +sliderEl.value;
    updateSliderUI();
    renderSidebar(sidebarSearch.value);
    saveSettings();
  });

  sliderEl.addEventListener("mouseenter", () => tooltipEl.classList.remove("hidden"));
  sliderEl.addEventListener("mouseleave", () => tooltipEl.classList.add("hidden"));

  labelEls.forEach(el => {
    el.addEventListener("click", () => {
      state.sidebarFreshnessLevel = +el.dataset.idx;
      updateSliderUI();
      renderSidebar(sidebarSearch.value);
      saveSettings();
    });
  });

  browseBtn.addEventListener("click", () => {
    sidebar.classList.toggle("hidden");
    if (!sidebar.classList.contains("hidden")) {
      renderSidebar(sidebarSearch.value);
    }
  });
  sidebarCloseBtn.addEventListener("click", () => sidebar.classList.add("hidden"));

  // ── Topic picker modal ─────────────────────────────────────────────────────
  topicPickerEl.addEventListener("click", openTopicModal);
  newTopicBtn.addEventListener("click", openTopicModal);

  function openTopicModal() {
    const catSelect = $("modal-category-select");
    const topicSelect = $("modal-topic-select");
    catSelect.innerHTML = `<option value="">— new category —</option>`;
    state.categories.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.name;
      opt.textContent = c.name;
      if (c.name === state.category) opt.selected = true;
      catSelect.appendChild(opt);
    });
    updateModalTopics();
    topicModal.classList.remove("hidden");
    catSelect.focus();
  }

  function updateModalTopics() {
    const catName = $("modal-category-select").value;
    const topicSelect = $("modal-topic-select");
    topicSelect.innerHTML = `<option value="">— new topic —</option>`;
    $("modal-new-category-row").style.display = catName ? "none" : "block";

    if (catName) {
      const cat = state.categories.find(c => c.name === catName);
      if (cat) {
        cat.topics.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t.name;
          opt.textContent = t.name;
          if (t.name === state.topic) opt.selected = true;
          topicSelect.appendChild(opt);
        });
      }
    }
    updateModalNewTopicRow();
  }

  function updateModalNewTopicRow() {
    const topicVal = $("modal-topic-select").value;
    $("modal-new-topic-row").style.display = topicVal ? "none" : "block";
  }

  $("modal-category-select").addEventListener("change", updateModalTopics);
  $("modal-topic-select").addEventListener("change", updateModalNewTopicRow);

  $("topic-modal-cancel").addEventListener("click", () => topicModal.classList.add("hidden"));
  $("topic-modal-confirm").addEventListener("click", () => {
    const catVal = $("modal-category-select").value || $("modal-new-category").value.trim();
    const topicVal = $("modal-topic-select").value || $("modal-new-topic").value.trim();
    if (!catVal || !topicVal) { toast("Both category and topic are required", "error"); return; }

    const cat = state.categories.find(c => c.name === catVal);
    const t = cat?.topics.find(t => t.name === topicVal);
    selectTopic(
      cat || { id: null, name: catVal, summary: "", updated_at_timestamp: null, topics: [] },
      t   || { id: null, name: topicVal, summary: "", updated_at_timestamp: null }
    );
    topicModal.classList.add("hidden");
  });

  // ── Select topic ────────────────────────────────────────────────────────────
  async function selectTopic(cat, t) {
    state.category = cat.name;
    state.topic = t.name;
    state.categoryId = cat.id || null;
    state.topicId = t.id || null;
    state.messages = [];

    topicPickerLbl.textContent = `${cat.name} / ${t.name}`;
    topicPickerLbl.classList.remove("placeholder");

    renderContextPreview(cat, t);
    renderMessages();
    renderSidebar(sidebarSearch.value);
    sidebar.classList.add("hidden");
    msgInput.focus();

    // Fetch conversations for this topic
    const params = new URLSearchParams();
    params.set("category", state.category);
    params.set("topic", state.topic);
    try {
      const conversations = await api("GET", `/conversations?${params}`);
      if (conversations.length === 1) {
        loadConversation(conversations[0].id);
      } else if (conversations.length > 1) {
        renderConvPicker(conversations);
      } else {
        hideConvPicker();
      }
    } catch {
      hideConvPicker();
    }
  }

  // ── Context preview ───────────────────────────────────────────────────────
  function renderContextPreview(cat, t) {
    contextBody.innerHTML = "";

    const cards = [];

    // Topic summary card
    cards.push(makeSummaryCard("Topic memory", t, "topic", t.id));

    // Category summary card
    if (cat.summary || cat.id) {
      cards.push(makeSummaryCard("Category overview", cat, "category", cat.id));
    }

    cards.forEach(c => contextBody.appendChild(c));

    // Update toggle label
    const hasSummary = t.summary || cat.summary;
    contextToggleLbl.textContent = hasSummary
      ? `What the AI knows about ${t.name}`
      : "No prior memory for this topic";

    if (!state.contextOpen) contextBody.style.display = "none";
  }

  function makeSummaryCard(title, item, type, id) {
    const card = document.createElement("div");
    card.className = "context-card";

    const fClass = freshnessClass(item.updated_at_timestamp);
    const rTime = relativeTime(item.updated_at_timestamp);

    card.innerHTML = `
      <div class="context-card-header">
        <span class="freshness-dot ${fClass}" title="Updated ${rTime}"></span>
        <span class="context-card-title">${escHtml(title)}</span>
        <div class="context-card-meta">
          <span class="meta-tag">${rTime}</span>
        </div>
      </div>
      <div class="context-text" id="ctx-text-${type}-${id}">
        ${item.summary
          ? escHtml(item.summary)
          : `<span class="context-empty">No memory yet — the AI will learn as you chat.</span>`}
      </div>
      <div class="context-actions" id="ctx-actions-${type}-${id}">
        ${id ? `<button class="ctx-action-btn" data-action="revise" data-type="${type}" data-id="${id}">Revise</button>
               <button class="ctx-action-btn danger" data-action="forget" data-type="${type}" data-id="${id}">Forget</button>` : ""}
      </div>
      <div id="ctx-edit-${type}-${id}"></div>
    `;

    // Revise / Forget actions
    card.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        const editEl = $(`ctx-edit-${type}-${id}`);
        if (action === "forget") {
          if (!confirm("Clear this memory? This can't be undone.")) return;
          updateSummary(type, id, "", item, card);
        } else if (action === "revise") {
          if ($(`ctx-edit-area-${type}-${id}`)) return; // already open
          const ta = document.createElement("textarea");
          ta.className = "inline-edit";
          ta.id = `ctx-edit-area-${type}-${id}`;
          ta.value = item.summary || "";
          const actions = document.createElement("div");
          actions.className = "inline-edit-actions";
          const saveBtn = document.createElement("button");
          saveBtn.className = "btn primary"; saveBtn.style.fontSize = "12px"; saveBtn.style.padding = "5px 10px";
          saveBtn.textContent = "Save";
          const cancelBtn = document.createElement("button");
          cancelBtn.className = "btn"; cancelBtn.style.fontSize = "12px"; cancelBtn.style.padding = "5px 10px";
          cancelBtn.textContent = "Cancel";
          actions.append(saveBtn, cancelBtn);
          editEl.append(ta, actions);
          ta.focus();
          saveBtn.addEventListener("click", () => updateSummary(type, id, ta.value, item, card));
          cancelBtn.addEventListener("click", () => editEl.innerHTML = "");
        }
      });
    });

    return card;
  }

  async function updateSummary(type, id, summary, item, card) {
    try {
      await api("POST", "/update-summary", { type, id: Number(id), summary });
      item.summary = summary;
      item.updated_at_timestamp = Math.floor(Date.now() / 1000);
      // refresh the card
      const newCard = makeSummaryCard(
        type === "topic" ? "Topic memory" : "Category overview",
        item, type, id
      );
      card.replaceWith(newCard);
      toast(summary ? "Memory updated" : "Memory cleared", "success");
    } catch (err) {
      toast("Couldn't update memory — " + err.message, "error");
    }
  }

  contextToggle.addEventListener("click", () => {
    state.contextOpen = !state.contextOpen;
    contextBody.style.display = state.contextOpen ? "flex" : "none";
    contextBody.style.flexDirection = "column";
    contextChevron.classList.toggle("open", state.contextOpen);
  });

  // ── Conversation picker ─────────────────────────────────────────────────────
  function renderConvPicker(conversations) {
    convPicker.style.display = "block";
    convPickerBody.innerHTML = "";

    conversations.forEach(conv => {
      const item = document.createElement("div");
      item.className = "conv-item";
      item.innerHTML = `
        <span class="conv-item-time">${relativeTime(conv.created_at)}</span>
        <div class="conv-item-body">
          <div class="conv-item-preview">${escHtml(conv.last_message || "—")}</div>
        </div>
        <button class="conv-delete-btn" title="Delete conversation" data-id="${conv.id}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      `;
      item.querySelector(".conv-item-body").addEventListener("click", () => loadConversation(conv.id));
      item.querySelector(".conv-delete-btn").addEventListener("click", async e => {
        e.stopPropagation();
        if (!confirm("Delete this conversation?")) return;
        try {
          await api("DELETE", `/conversation?id=${conv.id}`);
          const conversations = await api("GET", `/conversations?category=${encodeURIComponent(state.category)}&topic=${encodeURIComponent(state.topic)}`);
          if (conversations.length > 1) {
            renderConvPicker(conversations);
          } else if (conversations.length === 1) {
            loadConversation(conversations[0].id);
          } else {
            hideConvPicker();
          }
          toast("Conversation deleted", "success");
        } catch (err) {
          toast("Couldn't delete — " + err.message, "error");
        }
      });
      convPickerBody.appendChild(item);
    });

    convPickerBody.style.display = "none";
    convPickerChevron.classList.remove("open");
  }

  function hideConvPicker() {
    convPicker.style.display = "none";
  }

  convPickerToggle.addEventListener("click", () => {
    const isOpen = convPickerBody.style.display !== "none";
    convPickerBody.style.display = isOpen ? "none" : "flex";
    convPickerBody.style.flexDirection = "column";
    convPickerChevron.classList.toggle("open", !isOpen);
  });

  // ── Messages ───────────────────────────────────────────────────────────────
  function renderMessages() {
    // Remove all messages except empty state
    const nodes = Array.from(messagesEl.children);
    nodes.forEach(n => { if (n !== emptyState) n.remove(); });

    emptyState.style.display = state.messages.length ? "none" : "flex";
    state.messages.forEach(m => messagesEl.appendChild(createMsgEl(m)));
    scrollToBottom();
  }

  function createMsgEl(msg) {
    const div = document.createElement("div");
    div.className = `msg ${msg.role}`;
    const avatar = document.createElement("div");
    avatar.className = "msg-avatar";
    avatar.textContent = msg.role === "user" ? "U" : "AI";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble" + (msg.note ? " msg-note" : "");
    bubble.innerHTML = renderMarkdown(msg.content);
    div.append(avatar, bubble);
    return div;
  }

  function appendMessage(msg) {
    state.messages.push(msg);
    emptyState.style.display = "none";
    messagesEl.appendChild(createMsgEl(msg));
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Send ────────────────────────────────────────────────────────────────────
  msgInput.addEventListener("input", () => {
    sendBtn.disabled = !msgInput.value.trim();
    // auto-grow
    msgInput.style.height = "auto";
    msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + "px";
  });

  msgInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener("click", sendMessage);

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || state.loading) return;

    if (!state.category || !state.topic) {
      toast("Select a topic first", "error");
      openTopicModal();
      return;
    }

    const noteMode = noteModeToggle.checked;
    msgInput.value = "";
    msgInput.style.height = "auto";
    sendBtn.disabled = true;
    state.loading = true;

    appendMessage({ role: "user", content: text });

    // Typing indicator
    const typingEl = document.createElement("div");
    typingEl.className = "msg assistant";
    typingEl.innerHTML = `
      <div class="msg-avatar">AI</div>
      <div class="msg-bubble">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>`;
    messagesEl.appendChild(typingEl);
    scrollToBottom();

    try {
      const result = await api("POST", "/chat", {
        category: state.category,
        topic: state.topic,
        message: text,
        contextSources: state.activeContextSources,
        noteMode,
      });

      typingEl.remove();
      appendMessage({ role: "assistant", content: result.response, note: noteMode });

      // If new category/topic was created, refresh categories
      await loadCategories();
      renderSidebar(sidebarSearch.value);

      // Refresh context after first exchange
      const cat = state.categories.find(c => c.name === state.category);
      const t = cat?.topics.find(t => t.name === state.topic);
      if (cat && t) renderContextPreview(cat, t);

    } catch (err) {
      typingEl.remove();
      appendMessage({ role: "assistant", content: "Couldn't reach the assistant. " + err.message });
    } finally {
      state.loading = false;
    }
  }

  // ── Note mode toggle ─────────────────────────────────────────────────────
  noteModeToggle.addEventListener("change", () => {
    noteChip.classList.toggle("active", noteModeToggle.checked);
    msgInput.placeholder = noteModeToggle.checked
      ? "Save a note (no AI response)…"
      : "Type a message…";
  });

  // ── Update summaries ────────────────────────────────────────────────────────
  updateSumBtn.addEventListener("click", async () => {
    try {
      updateSumBtn.style.opacity = "0.5";
      await api("POST", "/update-summaries");
      await loadCategories();
      renderSidebar(sidebarSearch.value);

      // Refresh context preview
      const cat = state.categories.find(c => c.name === state.category);
      const t = cat?.topics.find(t => t.name === state.topic);
      if (cat && t) renderContextPreview(cat, t);

      toast("Summaries refreshed", "success");
    } catch (err) {
      toast("Couldn't refresh summaries — " + err.message, "error");
    } finally {
      updateSumBtn.style.opacity = "";
    }
  });

  // ── History ─────────────────────────────────────────────────────────────────
  $("history-modal-close").addEventListener("click", () => historyModal.classList.add("hidden"));

  async function refreshHistory() {
    const convList = $("conv-list");
    const filterLbl = $("history-filter-label");
    convList.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0">Loading…</div>`;

    const params = new URLSearchParams();
    if (state.category) params.set("category", state.category);
    if (state.topic) params.set("topic", state.topic);
    filterLbl.textContent = state.topic ? `${state.category} / ${state.topic}` : "all";

    try {
      const conversations = await api("GET", `/conversations?${params}`);
      convList.innerHTML = "";
      if (!conversations.length) {
        convList.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0">No conversations yet.</div>`;
        return;
      }
      conversations.forEach(conv => {
        const item = document.createElement("div");
        item.className = "conv-item";
        item.innerHTML = `
          <div class="conv-item-body">
            <div class="conv-item-topic">${escHtml(conv.category)} / ${escHtml(conv.topic)}</div>
            <div class="conv-item-preview">${escHtml(conv.last_message || "—")}</div>
          </div>
          <span class="conv-item-time">${relativeTime(conv.created_at)}</span>
          <button class="conv-delete-btn" title="Delete conversation" data-id="${conv.id}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        `;
        item.querySelector(".conv-item-body").addEventListener("click", () => loadConversation(conv.id));
        item.querySelector(".conv-delete-btn").addEventListener("click", async e => {
          e.stopPropagation();
          if (!confirm("Delete this conversation?")) return;
          try {
            await api("DELETE", `/conversation?id=${conv.id}`);
            await refreshHistory();
            toast("Conversation deleted", "success");
          } catch (err) {
            toast("Couldn't delete — " + err.message, "error");
          }
        });
        convList.appendChild(item);
      });
    } catch (err) {
      convList.innerHTML = `<div style="color:var(--red);font-size:13px;padding:8px 0">Couldn't load history — ${err.message}</div>`;
    }
  }

  async function loadConversation(id) {
    try {
      const conv = await api("GET", `/conversation?id=${id}`);
      // Set topic context
      const cat = state.categories.find(c => c.name === conv.category)
        || { id: null, name: conv.category, summary: "", updated_at_timestamp: null, topics: [] };
      const t = cat.topics?.find(t => t.name === conv.topic)
        || { id: null, name: conv.topic, summary: "", updated_at_timestamp: null };

      state.category = conv.category;
      state.topic = conv.topic;
      topicPickerLbl.textContent = `${conv.category} / ${conv.topic}`;
      topicPickerLbl.classList.remove("placeholder");
      state.messages = conv.messages;
      convPickerBody.style.display = "none";
      convPickerChevron.classList.remove("open");

      renderContextPreview(cat, t);
      renderMessages();
      renderSidebar(sidebarSearch.value);
      historyModal.classList.add("hidden");
    } catch (err) {
      toast("Couldn't load conversation — " + err.message, "error");
    }
  }

  // ── Settings ────────────────────────────────────────────────────────────────
  settingsBtn.addEventListener("click", () => {
    $("settings-api-key").value = state.apiKey;
    settingsModal.classList.remove("hidden");
  });
  $("settings-cancel").addEventListener("click", () => settingsModal.classList.add("hidden"));
  $("settings-save").addEventListener("click", () => {
    const key = $("settings-api-key").value.trim();
    if (!key) { toast("API key is required", "error"); return; }
    state.apiKey = key;
    state.endpoint = window.location.origin;
    saveSettings();
    settingsModal.classList.add("hidden");
    toast("Settings saved", "success");
    init();
  });

  // ── Close modals on backdrop click ──────────────────────────────────────────
  [topicModal, historyModal, settingsModal].forEach(modal => {
    modal.addEventListener("click", e => {
      if (e.target === modal) modal.classList.add("hidden");
    });
  });

})();
</script>
</body>
</html>
