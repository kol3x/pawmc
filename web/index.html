		<meta name="theme-color" content="#f6f0e4" />
		<script>
			try {
				var pref = localStorage.getItem("pa_theme") || "system"
				if (pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
					document.documentElement.classList.add("dark")
			} catch (e) {}
		</script>
