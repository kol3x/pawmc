name: Deploy Personal Assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Set API_KEY secret
        run: |
          cat > /tmp/api-key <<'EOF'
          ${{ secrets.API_KEY }}
          EOF
          cat /tmp/api-key | npx wrangler secret put API_KEY
          rm /tmp/api-key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Set OPENROUTER_API_KEY secret
        run: |
          cat > /tmp/openrouter-key <<'EOF'
          ${{ secrets.OPENROUTER_API_KEY }}
          EOF
          cat /tmp/openrouter-key | npx wrangler secret put OPENROUTER_API_KEY
          rm /tmp/openrouter-key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}