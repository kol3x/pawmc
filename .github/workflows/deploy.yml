name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Detect Workers Subdomain
        run: |
          EMAIL=$(curl -s -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/user" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['result']['email'])")
          SUBDOMAIN="${EMAIL%@*}"
          echo "CLOUDFLARE_SUBDOMAIN=$SUBDOMAIN" >> $GITHUB_ENV
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Set API_KEY secret
        run: |
          cat > /tmp/api-key <<'EOF'
          ${{ secrets.API_KEY }}
          EOF
          cat /tmp/api-key | npx wrangler secret put API_KEY
          rm /tmp/api-key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Print URL
        run: echo "✅ Live at https://personal-assistant.$CLOUDFLARE_SUBDOMAIN.workers.dev"
