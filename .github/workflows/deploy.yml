name: Deploy Pawmc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build -w web
      - name: Deploy
        run: |
          printf 'API_KEY=%s\n' "$PAWMC_API_KEY" > "$RUNNER_TEMP/pawmc-secrets"
          if [ -n "$PAWMC_OPENROUTER_API_KEY" ]; then
            printf 'OPENROUTER_API_KEY=%s\n' "$PAWMC_OPENROUTER_API_KEY" >> "$RUNNER_TEMP/pawmc-secrets"
          fi
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/pawmc-secrets"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAWMC_API_KEY: ${{ secrets.API_KEY }}
          PAWMC_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}